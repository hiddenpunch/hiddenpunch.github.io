{{- /* 비밀댓글 (myadmin + NextAuth) + 공개댓글 (giscus) */ -}}

<div id="comments-section" class="comments-container">
  <h3>💬 댓글</h3>
  
  <!-- 로그인 상태 표시 -->
  <div id="auth-section" class="auth-section">
    <div id="logged-out">
      <p>비밀댓글을 작성하려면 로그인하세요.</p>
      <button id="github-login" onclick="loginWithGithub()">
        <svg height="20" width="20" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 8px;">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        GitHub로 로그인
      </button>
    </div>
    <div id="logged-in" style="display: none;">
      <p>
        <img id="user-avatar" src="" alt="" style="width: 24px; height: 24px; border-radius: 50%; vertical-align: middle; margin-right: 8px;" />
        <span id="user-name"></span>님으로 로그인됨
        <button onclick="logout()" style="margin-left: 1rem; font-size: 0.85rem;">로그아웃</button>
      </p>
    </div>
  </div>

  <!-- 비밀댓글 작성 폼 (로그인 후) -->
  <div id="comment-form" class="comment-form" style="display: none;">
    <h4>🔒 비밀댓글 작성</h4>
    <textarea id="comment-body" placeholder="비밀댓글 내용... (관리자만 볼 수 있어요)" rows="3"></textarea>
    <button id="submit-comment" onclick="submitComment()">비밀댓글 등록</button>
    <p id="comment-status"></p>
  </div>

  <!-- 비밀댓글 목록 (관리자만) -->
  <div id="private-comments-list" style="display: none;">
    <h4>🔒 비밀댓글</h4>
    <div id="private-comments"></div>
  </div>

  <hr style="margin: 2rem 0;" />

  <!-- 공개댓글 (giscus) -->
  <div id="public-comments">
    <h4>💬 공개댓글</h4>
    <p style="font-size: 0.9rem; color: var(--secondary); margin-bottom: 1rem;">
      공개댓글은 GitHub 계정으로 아래에서 작성해주세요!
    </p>
    {{- if .Site.Params.giscus.repo -}}
    <script src="https://giscus.app/client.js"
            data-repo="{{ .Site.Params.giscus.repo }}"
            data-repo-id="{{ .Site.Params.giscus.repoId }}"
            data-category="{{ .Site.Params.giscus.category }}"
            data-category-id="{{ .Site.Params.giscus.categoryId }}"
            data-mapping="{{ default "pathname" .Site.Params.giscus.mapping }}"
            data-strict="{{ default "0" .Site.Params.giscus.strict }}"
            data-reactions-enabled="{{ default "1" .Site.Params.giscus.reactionsEnabled }}"
            data-emit-metadata="{{ default "0" .Site.Params.giscus.emitMetadata }}"
            data-input-position="{{ default "bottom" .Site.Params.giscus.inputPosition }}"
            data-theme="{{ default "preferred_color_scheme" .Site.Params.giscus.theme }}"
            data-lang="{{ default "ko" .Site.Params.giscus.lang }}"
            crossorigin="anonymous"
            async>
    </script>
    {{- end -}}
  </div>
</div>

<style>
.comments-container {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}

.auth-section {
  margin-bottom: 1.5rem;
}

#github-login {
  background: #24292e;
  color: white;
  border: none;
  padding: 0.75rem 1.5rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1rem;
  display: inline-flex;
  align-items: center;
}

#github-login:hover {
  background: #2f363d;
}

.comment-form {
  background: var(--code-bg);
  padding: 1.5rem;
  border-radius: 8px;
  margin-bottom: 2rem;
}

.comment-form h4 {
  margin-top: 0;
}

.comment-form textarea {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--theme);
  color: var(--primary);
  font-family: inherit;
  resize: vertical;
  min-height: 80px;
}

#submit-comment {
  background: #ffd43b;
  color: #1a1a1a;
  border: none;
  padding: 0.75rem 1.5rem;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
}

#submit-comment:hover {
  background: #fab005;
}

#comment-status {
  margin-top: 0.5rem;
  font-size: 0.9rem;
}

.private-comment {
  background: var(--code-bg);
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 3px solid #ffd43b;
}

.private-comment .comment-meta {
  font-size: 0.85rem;
  color: var(--secondary);
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.private-comment .comment-meta img {
  width: 20px;
  height: 20px;
  border-radius: 50%;
}

.private-comment .comment-body {
  line-height: 1.6;
}
</style>

<script>
const API_BASE = 'https://myadmin-khaki.vercel.app';
const POST_SLUG = '{{ .RelPermalink }}';

let currentUser = null;

// 페이지 로드 시 세션 확인
document.addEventListener('DOMContentLoaded', async () => {
  await checkSession();
  await loadPrivateComments();
});

async function checkSession() {
  try {
    const res = await fetch(`${API_BASE}/api/auth/session`, {
      credentials: 'include'
    });
    const session = await res.json();
    
    if (session?.user) {
      currentUser = session.user;
      showLoggedIn();
    } else {
      showLoggedOut();
    }
  } catch (err) {
    console.error('Session check failed:', err);
    showLoggedOut();
  }
}

function loginWithGithub() {
  // myadmin NextAuth GitHub 로그인으로 리다이렉트
  const callbackUrl = encodeURIComponent(window.location.href);
  window.location.href = `${API_BASE}/api/auth/signin/github?callbackUrl=${callbackUrl}`;
}

function logout() {
  window.location.href = `${API_BASE}/api/auth/signout?callbackUrl=${encodeURIComponent(window.location.href)}`;
}

function showLoggedIn() {
  document.getElementById('logged-out').style.display = 'none';
  document.getElementById('logged-in').style.display = 'block';
  document.getElementById('comment-form').style.display = 'block';
  
  document.getElementById('user-name').textContent = currentUser.name || currentUser.email || 'User';
  if (currentUser.image) {
    document.getElementById('user-avatar').src = currentUser.image;
  }
}

function showLoggedOut() {
  document.getElementById('logged-out').style.display = 'block';
  document.getElementById('logged-in').style.display = 'none';
  document.getElementById('comment-form').style.display = 'none';
}

async function submitComment() {
  const body = document.getElementById('comment-body').value;
  const status = document.getElementById('comment-status');

  if (!body.trim()) {
    status.textContent = '❌ 댓글 내용을 입력해주세요.';
    return;
  }

  status.textContent = '⏳ 등록 중...';

  try {
    const res = await fetch(`${API_BASE}/api/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        post_slug: POST_SLUG,
        content: body,
        is_private: true
      })
    });

    if (res.ok) {
      status.textContent = '✅ 비밀댓글이 등록되었습니다!';
      document.getElementById('comment-body').value = '';
      loadPrivateComments();
    } else {
      const err = await res.json();
      status.textContent = '❌ ' + (err.error || '등록 실패');
    }
  } catch (err) {
    status.textContent = '❌ 네트워크 오류';
    console.error(err);
  }
}

async function loadPrivateComments() {
  // 관리자만 비밀댓글 볼 수 있음
  const isAdmin = currentUser && (
    currentUser.email === 'gideok.kim@dalpha.so' ||
    currentUser.login === 'hiddenpunch' ||
    localStorage.getItem('blog_admin') === 'true'
  );
  
  if (!isAdmin) return;

  try {
    const res = await fetch(
      `${API_BASE}/api/comments?post_slug=${encodeURIComponent(POST_SLUG)}&include_private=true`,
      { credentials: 'include' }
    );
    const comments = await res.json();

    const container = document.getElementById('private-comments');
    const list = document.getElementById('private-comments-list');

    const privateComments = comments.filter(c => c.is_private);
    
    if (privateComments.length > 0) {
      list.style.display = 'block';
      container.innerHTML = privateComments.map(c => `
        <div class="private-comment">
          <div class="comment-meta">
            ${c.author_avatar ? `<img src="${c.author_avatar}" alt="" />` : ''}
            <strong>${escapeHtml(c.author_name)}</strong>
            ${c.author_github ? `<a href="https://github.com/${c.author_github}" target="_blank">@${c.author_github}</a>` : ''}
            · ${new Date(c.created_at).toLocaleDateString('ko-KR')}
          </div>
          <div class="comment-body">${escapeHtml(c.body)}</div>
        </div>
      `).join('');
    }
  } catch (err) {
    console.error('Failed to load comments:', err);
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>

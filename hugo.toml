baseURL = "https://hiddenpunch.github.io/"
googleAnalytics = "G-L25R6R8HN1"
languageCode = "ko-kr"
title = "Hiddenpunch's Tech Blog"
theme = "PaperMod"
defaultContentLanguage = "ko"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

[params]
  env = "production"
  title = "Hiddenpunch's Tech Blog"
  description = "데이터 엔지니어링, AI, 백엔드 개발 이야기"
  keywords = ["Blog", "Data Engineering", "AI", "Kotlin", "Backend", "DevOps"]
  author = "Hiddenpunch"
  
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = true
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "안녕하세요 👋"
    Content = ""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hiddenpunch"

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

[params.editPost]
  URL = "https://github.com/hiddenpunch/hiddenpunch.github.io/edit/main/content"
  Text = "수정 제안"
  appendFilePath = true

[params.supabase]
  anonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sdGZ4b3JjbHNzemFjand2ZWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MDczNjYsImV4cCI6MjA4NTk4MzM2Nn0.1JqoqA_CKkdxvqUiB9wtQStMshSSQ5LbwQrC78-Ewt4"

[params.giscus]
  repo = "hiddenpunch/hiddenpunch.github.io"
  repoId = "R_kgDORHYCPw"
  category = "Comments"
  categoryId = "DIC_kwDORHYCP84C2nhd"
  mapping = "pathname"
  strict = "1"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "ko"

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "series"
  name = "Series"
  url = "/series/"
  weight = 35

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 40

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
